<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380">
  <defs>
    <style>
      text { font-family: 'Consolas','Cascadia Code','Fira Code','Courier New',monospace; font-size: 11.5px; fill: #c9d1d9; }
      .section-title { font-size: 12.5px; font-weight: 700; }
      .pct-label { font-size: 10px; fill: #8b949e; }
      
      @keyframes barFill { 0% { width: 0; } 100% { width: var(--tw); } }
      @keyframes fadeSlide { 0% { opacity: 0; transform: translateX(-10px); } 100% { opacity: 1; transform: translateX(0); } }
      .bar-fill { width: 0; }
      .skill-row { opacity: 0; }

    </style>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal background -->
  <rect x="1" y="1" width="858" height="378" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header bar -->
  <path d="M1,11 A10,10 0 0,1 11,1 L849,1 A10,10 0 0,1 859,11 L859,30 L1,30Z" fill="#161b22"/>
  <line x1="1" y1="30" x2="859" y2="30" stroke="#30363d" stroke-width="1"/>

  <!-- Window buttons -->
  <circle cx="18" cy="15" r="4.5" fill="#ff5f56"/>
  <circle cx="32" cy="15" r="4.5" fill="#ffbd2e"/>
  <circle cx="46" cy="15" r="4.5" fill="#27c93f"/>

