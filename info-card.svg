      <animateTransform attributeName="transform" type="translate" from="0, 8" to="0, 0" dur="0.35s" begin="0.63s" fill="freeze" />
      <text x="24" y="228" class="mono-font">
        <tspan class="label-key" fill="#d29922">Prev</tspan>
