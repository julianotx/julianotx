<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="680" height="570">
  <defs>
    <style>

      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .card-header { fill: #161b22; }
      .header-title { fill: #8b949e; font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 500; }
      .mono-font {
        font-family: 'Consolas', 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
        font-size: 12.5px;
      }
      .prompt-user { fill: #58a6ff; font-weight: 600; }
      .prompt-at { fill: #8b949e; }
      .prompt-host { fill: #bc8cff; font-weight: 600; }
      .prompt-dir { fill: #7ee787; }
      .prompt-cmd { fill: #f0f6fc; }
      .label-key { fill: #58a6ff; font-weight: 600; }
      .label-colon { fill: #8b949e; }
      .label-val { fill: #c9d1d9; }
    

      @keyframes slideInFade {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animated-row {
        opacity: 0;
        animation: slideInFade 0.35s cubic-bezier(0.2, 0.0, 0.35, 1) forwards;
      }
        
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="678" height="568" class="card-bg" />

  <!-- Terminal Header Bar -->
  <path d="M 1,11 A 10,10 0 0,1 11,1 L 669,1 A 10,10 0 0,1 679,11 L 679,30 L 1,30 Z" class="card-header" />
  <line x1="1" y1="30" x2="679" y2="30" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Buttons -->
  <circle cx="18" cy="15" r="4.5" fill="#ff5f56" />
  <circle cx="32" cy="15" r="4.5" fill="#ffbd2e" />
  <circle cx="46" cy="15" r="4.5" fill="#27c93f" />

  <!-- Header Title -->
  <text x="340" y="19" text-anchor="middle" class="header-title">julianotx@github ~ neofetch</text>

  <!-- Neofetch Content Body -->

    <g class="animated-row" style="animation-delay: 0.15s;">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.15s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0, 8" to="0, 0" dur="0.35s" begin="0.15s" fill="freeze" />
      <text x="24" y="65" class="mono-font">
        <tspan class="prompt-user">julianotx</tspan>
        <tspan class="prompt-at">@</tspan>
        <tspan class="prompt-host">github</tspan>
        <tspan class="label-val">:</tspan>
        <tspan class="prompt-dir">~</tspan>
        <tspan class="label-val">$ </tspan>
        <tspan class="prompt-cmd">neofetch --profile</tspan>
      </text>
    </g>

    <g class="animated-row" style="animation-delay: 0.23s;">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.23s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0, 8" to="0, 0" dur="0.35s" begin="0.23s" fill="freeze" />
      <text x="24" y="100" class="mono-font" font-weight="700" font-size="14px" fill="#58a6ff">
        julianotx@github
      </text>
    </g>

    <g class="animated-row" style="animation-delay: 0.31s;">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.31s" fill="freeze" />
