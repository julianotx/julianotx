      <rect x="24" y="408" width="26" height="13" rx="2" fill="#0d1117" /> <rect x="55" y="408" width="26" height="13" rx="2" fill="#ff7b72" /> <rect x="86" y="408" width="26" height="13" rx="2" fill="#7ee787" /> <rect x="117" y="408" width="26" height="13" rx="2" fill="#f2cc60" /> <rect x="148" y="408" width="26" height="13" rx="2" fill="#79c0ff" /> <rect x="179" y="408" width="26" height="13" rx="2" fill="#d2a8ff" /> <rect x="210" y="408" width="26" height="13" rx="2" fill="#56d364" /> <rect x="241" y="408" width="26" height="13" rx="2" fill="#c9d1d9" />
      <rect x="24" y="424" width="26" height="13" rx="2" fill="#484f58" /> <rect x="55" y="424" width="26" height="13" rx="2" fill="#ffa198" /> <rect x="86" y="424" width="26" height="13" rx="2" fill="#56d364" /> <rect x="117" y="424" width="26" height="13" rx="2" fill="#e3b341" /> <rect x="148" y="424" width="26" height="13" rx="2" fill="#a5d6ff" /> <rect x="179" y="424" width="26" height="13" rx="2" fill="#e2c5ff" /> <rect x="210" y="424" width="26" height="13" rx="2" fill="#39d353" /> <rect x="241" y="424" width="26" height="13" rx="2" fill="#f0f6fc" />
